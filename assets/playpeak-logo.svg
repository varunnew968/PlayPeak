    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <g>
    <rect x="2" y="2" width="56" height="56" rx="17" fill="url(#iconBg)" stroke="#173D67"/>
    <circle cx="30" cy="30" r="24.4" stroke="url(#ring)" stroke-width="1.8" opacity=".9"/>
    <path d="M10.5 35.7 21.3 20.1 27.8 27.1 39.2 12.5 50.3 32.8 43.6 29.6 39.4 23.7 29.1 37.1 21.9 29.8 17.5 35.7Z" fill="url(#peak)" filter="url(#softGlow)"/>
    <path d="M13.5 34.8c-3.4 0-5 3.7-3.8 7.2l2.5 6.3c1.1 2.8 4.3 3.1 6 .8l3.6-4.8h16.4l3.6 4.8c1.7 2.3 4.9 2 6-.8l2.5-6.3c1.2-3.5-.4-7.2-3.8-7.2H13.5Z" fill="url(#pad)" stroke="#D8F8FF" stroke-width=".7"/>
    <path d="M17.6 38.3v7.2M14 41.9h7.2" stroke="#087BEE" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="38.8" cy="39.3" r="2.1" fill="#03C8F9"/>
    <circle cx="44.1" cy="43.2" r="2.1" fill="#168BFF"/>
    <circle cx="43.9" cy="36.6" r="2.1" fill="#04D8F5"/>
