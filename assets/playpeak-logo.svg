<svg xmlns="http://www.w3.org/2000/svg" width="280" height="60" viewBox="0 0 280 60" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">PlayPeak</title>
  <desc id="desc">PlayPeak gaming logo combining a neon mountain peak and a game controller.</desc>
  <defs>
    <linearGradient id="iconBg" x1="3" y1="2" x2="59" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11254A"/>
      <stop offset="1" stop-color="#071326"/>
    </linearGradient>
    <linearGradient id="ring" x1="6" y1="3" x2="58" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#187BFF"/>
      <stop offset=".56" stop-color="#06E5FF"/>
      <stop offset="1" stop-color="#1473FF"/>
    </linearGradient>
    <linearGradient id="peak" x1="15" y1="12" x2="48" y2="39" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FEFF"/>
      <stop offset=".38" stop-color="#24E9FF"/>
      <stop offset="1" stop-color="#1174FF"/>
    </linearGradient>
    <linearGradient id="pad" x1="13" y1="31" x2="51" y2="51" gradientUnits="userSpaceOnUse">
